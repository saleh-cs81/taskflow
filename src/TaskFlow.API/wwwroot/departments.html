<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="page-head">
      <div>
        <h1 class="ph-title" data-i18n="dept.title"></h1>
        <div class="ph-sub" data-i18n="dept.subtitle"></div>
      </div>
      <div class="d-flex gap-2" id="adminActions" hidden>
        <button class="btn btn-outline-secondary" id="assignBtn" title="" data-i18n-title="dept.assignHint"><i class="bi bi-magic"></i> <span data-i18n="dept.assign"></span></button>
        <button class="btn btn-primary" id="newDeptBtn"><i class="bi bi-plus-lg"></i> <span data-i18n="dept.new"></span></button>
      </div>
    </div>

    <div class="row g-3 mb-4" id="deptStats"></div>

    <!-- Departments -->
    <div id="deptList" class="row g-3"></div>

    <!-- Paymo migration catalog (department-scoped) -->
    <div class="card shadow-sm mt-4"><div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
        <h6 class="mb-0"><i class="bi bi-plug text-muted"></i> <span data-i18n="dept.migrateTitle"></span>
          <span class="badge bg-light text-dark border" id="catCount">0</span></h6>
        <input class="form-control form-control-sm w-auto" id="catSearch" placeholder="" data-i18n-ph="dept.catSearch">
      </div>
      <div class="ph-sub mb-2" data-i18n="dept.migrateHint"></div>
      <div id="catList"></div>
    </div></div>
  </div>

  <!-- Create / edit department -->
  <div class="modal fade" id="deptModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form id="deptForm">
      <div class="modal-header">
        <h5 class="modal-title" id="deptModalTitle" data-i18n="dept.new"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="deptError"></div>
        <input type="hidden" id="d_id">
        <div class="mb-3">
          <label class="form-label" data-i18n="dept.name"></label>
          <input class="form-control" id="d_name" required maxlength="150">
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="dept.prefix"></label>
          <input class="form-control" id="d_prefix" maxlength="30" placeholder="ASP-">
          <div class="form-text" data-i18n="dept.prefixHint"></div>
        </div>
        <div class="mb-1">
          <label class="form-label" data-i18n="dept.admins"></label>
          <div id="d_admins" class="border rounded p-2 d-flex flex-column gap-1" style="max-height:220px;overflow:auto"></div>
        </div>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-outline-danger" id="deptDeleteBtn" hidden data-i18n="dept.delete"></button>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel"></button>
          <button type="submit" class="btn btn-primary" data-i18n="common.save"></button>
        </div>
      </div>
    </form>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/departments.js?v=20260706o"></script>
</body>
</html>
