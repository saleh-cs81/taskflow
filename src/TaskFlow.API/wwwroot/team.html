<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <h3 class="mb-4" data-i18n="team.title"></h3>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 data-i18n="team.members"></h5>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th data-i18n="team.members"></th>
                    <th data-i18n="team.roles"></th>
                    <th data-i18n="team.lastLogin"></th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="usersBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="card shadow-sm mt-4">
          <div class="card-body">
            <h5 data-i18n="team.pending"></h5>
            <div id="pendingList"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 data-i18n="team.invite"></h5>
            <div id="inviteAlert"></div>
            <form id="inviteForm">
              <div class="mb-3">
                <label class="form-label" data-i18n="team.email"></label>
                <input type="email" class="form-control" id="inviteEmail" required>
              </div>
              <div class="mb-3">
                <label class="form-label" data-i18n="team.role"></label>
                <select class="form-select" id="inviteRole"></select>
              </div>
              <button class="btn btn-primary" type="submit" data-i18n="team.send"></button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js"></script>
  <script src="/assets/js/core/api.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/core/realtime.js"></script>
  <script src="/assets/js/core/ui.js"></script>
  <script src="/assets/js/pages/team.js"></script>
</body>
</html>
