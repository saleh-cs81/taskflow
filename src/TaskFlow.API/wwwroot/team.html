<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="page-head">
      <div>
        <h1 class="ph-title" data-i18n="team.title"></h1>
        <div class="ph-sub" data-i18n="team.subtitle"></div>
      </div>
      <button class="btn btn-primary" id="inviteBtn"><i class="bi bi-person-plus"></i> <span data-i18n="team.invite"></span></button>
    </div>

    <!-- Metrics -->
    <div class="row g-3 mb-4" id="teamStats"></div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
              <h6 class="mb-0"><span data-i18n="team.members"></span> <span class="badge bg-light text-dark border" id="memberCount">0</span></h6>
              <div class="input-group input-group-sm" style="max-width:240px">
                <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                <input class="form-control" id="userSearch" placeholder="" data-i18n-ph="team.search">
              </div>
            </div>
            <div id="usersList"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6 class="mb-3"><span data-i18n="team.pending"></span> <span class="badge bg-light text-dark border" id="pendingCount">0</span></h6>
            <div id="pendingList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Invite teammate -->
  <div class="modal fade" id="inviteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" data-i18n="team.invite"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="inviteForm">
          <div class="modal-body">
            <div id="inviteAlert"></div>
            <div class="mb-3">
              <label class="form-label" data-i18n="team.email"></label>
              <input type="email" class="form-control" id="inviteEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label" data-i18n="team.role"></label>
              <select class="form-select" id="inviteRole"></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel"></button>
            <button class="btn btn-primary" type="submit" data-i18n="team.send"></button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Edit member (roles + active) -->
  <div class="modal fade" id="editUserModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" data-i18n="team.editMember"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="editUserForm">
          <div class="modal-body">
            <div id="editUserError"></div>
            <div class="d-flex align-items-center gap-2 mb-3" id="euHeader"></div>
            <input type="hidden" id="eu_id">
            <label class="form-label" data-i18n="team.roles"></label>
            <div id="eu_roles" class="mb-3 d-flex flex-column gap-1"></div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="eu_active">
              <label class="form-check-label" for="eu_active" data-i18n="team.active"></label>
            </div>

            <hr class="my-3">
            <label class="form-label" data-i18n="team.newPassword"></label>
            <div class="input-group">
              <input type="text" class="form-control" id="eu_password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="" data-i18n-ph="team.newPasswordPh">
              <button type="button" class="btn btn-outline-secondary" id="eu_genPwBtn"><i class="bi bi-shuffle"></i> <span data-i18n="team.generate"></span></button>
              <button type="button" class="btn btn-outline-primary" id="eu_setPwBtn" data-i18n="team.setPassword"></button>
            </div>
            <div class="form-text" data-i18n="team.passwordHint"></div>
            <div id="eu_pwMsg" class="mt-1"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel"></button>
            <button class="btn btn-primary" type="submit" data-i18n="team.saveChanges"></button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- A user's projects -->
  <div class="modal fade" id="userProjectsModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="upTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="upBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/team.js?v=20260706o"></script>
</body>
</html>
