<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="container">
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0" data-i18n="accept.title"></h4>
          <button class="btn btn-outline-secondary btn-sm" id="langToggle" data-i18n="lang.toggle"></button>
        </div>
        <div id="msg"></div>
        <form id="acceptForm">
          <div class="mb-3">
            <label class="form-label" data-i18n="accept.fullname"></label>
            <input type="text" class="form-control" id="fullName" required>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="accept.password"></label>
            <input type="password" class="form-control" id="password" minlength="8" required>
          </div>
          <button class="btn btn-primary w-100" type="submit" data-i18n="accept.submit"></button>
        </form>
      </div>
    </div>
  </div>

  <script src="/assets/js/core/i18n.js"></script>
  <script src="/assets/js/core/api.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/pages/accept.js"></script>
</body>
</html>
