<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0" data-i18n="ts.title"></h3>
      <form id="tsForm" class="d-flex gap-2 align-items-end">
        <div><label class="form-label small mb-0" data-i18n="ts.from"></label>
          <input type="date" class="form-control form-control-sm" id="ts_from" required></div>
        <div><label class="form-label small mb-0" data-i18n="ts.to"></label>
          <input type="date" class="form-control form-control-sm" id="ts_to" required></div>
        <button class="btn btn-primary btn-sm" type="submit" data-i18n="ts.new"></button>
      </form>
    </div>
    <div id="tsErr"></div>
    <div class="card shadow-sm"><div class="card-body p-0">
      <table class="table table-sm mb-0 align-middle">
        <thead><tr>
          <th data-i18n="ts.period"></th><th data-i18n="common.status"></th>
          <th class="text-end" data-i18n="ts.hours"></th><th></th>
        </tr></thead>
        <tbody id="tsBody"></tbody>
      </table>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/timesheets.js?v=20260706o"></script>
</body>
</html>
