<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0" data-i18n="rec.title"></h3>
      <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#recModal" data-i18n="rec.new"></button>
    </div>
    <div class="card shadow-sm"><div class="card-body p-0">
      <table class="table table-sm mb-0 align-middle">
        <thead><tr>
          <th data-i18n="rec.template"></th><th data-i18n="rec.every"></th>
          <th data-i18n="rec.next"></th><th data-i18n="rec.active"></th><th></th>
        </tr></thead>
        <tbody id="recBody"></tbody>
      </table>
    </div></div>
  </div>

  <div class="modal fade" id="recModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form id="recForm">
      <div class="modal-header"><h5 class="modal-title" data-i18n="rec.new"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="recErr"></div>
        <div class="mb-3"><label class="form-label" data-i18n="proj.name"></label>
          <select class="form-select" id="r_project" required></select></div>
        <div class="mb-3"><label class="form-label" data-i18n="rec.template"></label>
          <input type="text" class="form-control" id="r_title" required maxlength="300"></div>
        <div class="row g-2">
          <div class="col-4"><label class="form-label" data-i18n="rec.every"></label>
            <input type="number" min="1" class="form-control" id="r_interval" value="1"></div>
          <div class="col-4"><label class="form-label" data-i18n="rec.unit"></label>
            <select class="form-select" id="r_unit">
              <option value="0" data-i18n="rec.daily"></option>
              <option value="1" selected data-i18n="rec.weekly"></option>
              <option value="2" data-i18n="rec.monthly"></option>
            </select></div>
          <div class="col-4"><label class="form-label" data-i18n="rec.next"></label>
            <input type="date" class="form-control" id="r_first" required></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="proj.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="proj.create"></button>
      </div>
    </form>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/recurring.js?v=20260706o"></script>
</body>
</html>
