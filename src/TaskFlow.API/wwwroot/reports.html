<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <h3 class="mb-4" data-i18n="rep.title"></h3>

    <h5 data-i18n="rep.stats"></h5>
    <div class="row g-3 mb-4" id="statCards"></div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0" data-i18n="rep.progress"></h5>
          <div class="btn-group">
            <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
              <span data-i18n="rep.export"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#" data-fmt="2">PDF</a></li>
              <li><a class="dropdown-item" href="#" data-fmt="1">Excel</a></li>
              <li><a class="dropdown-item" href="#" data-fmt="0">CSV</a></li>
            </ul>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead>
              <tr>
                <th data-i18n="rep.col.project"></th>
                <th data-i18n="rep.col.status"></th>
                <th data-i18n="rep.col.total"></th>
                <th data-i18n="rep.col.todo"></th>
                <th data-i18n="rep.col.inprogress"></th>
                <th data-i18n="rep.col.done"></th>
                <th style="min-width:160px" data-i18n="rep.col.percent"></th>
              </tr>
            </thead>
            <tbody id="progressBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/reports.js?v=20260706o"></script>
</body>
</html>
