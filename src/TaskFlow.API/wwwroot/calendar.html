<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0" data-i18n="cal.title"></h3>
      <div class="btn-group">
        <button class="btn btn-outline-secondary btn-sm" id="prevMonth">&lsaquo;</button>
        <button class="btn btn-outline-secondary btn-sm" id="todayBtn" data-i18n="cal.today"></button>
        <button class="btn btn-outline-secondary btn-sm" id="nextMonth">&rsaquo;</button>
      </div>
    </div>
    <h5 id="monthLabel" class="mb-3"></h5>

    <div class="cal-grid mb-2" id="calDow"></div>
    <div class="cal-grid" id="calGrid"></div>

    <h5 class="mt-4" data-i18n="cal.timeline"></h5>
    <div class="card shadow-sm"><div class="card-body" id="gantt"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/calendar.js?v=20260706o"></script>
</body>
</html>
