<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <h3 class="mb-4"><span data-i18n="dash.welcome"></span>, <span id="userName"></span></h3>

    <div class="row g-4">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 data-i18n="dash.timer"></h5>
            <div id="timerStatus" class="mb-2 text-muted" data-i18n="dash.noTimer"></div>
            <div class="d-flex gap-2">
              <select class="form-select form-select-sm" id="timerProject"></select>
              <button class="btn btn-success btn-sm" id="startBtn" data-i18n="dash.start"></button>
              <button class="btn btn-danger btn-sm d-none" id="stopBtn" data-i18n="dash.stop"></button>
            </div>
          </div>
        </div>

        <div class="card shadow-sm mt-4">
          <div class="card-body">
            <h5 data-i18n="dash.projects"></h5>
            <div id="projectList"></div>
          </div>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 data-i18n="dash.activity"></h5>
            <ul class="list-group list-group-flush" id="activityList"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js"></script>
  <script src="/assets/js/core/api.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/core/realtime.js"></script>
  <script src="/assets/js/core/ui.js"></script>
  <script src="/assets/js/pages/dashboard.js"></script>
</body>
</html>
