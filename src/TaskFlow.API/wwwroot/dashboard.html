<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <h3 class="mb-4"><span data-i18n="dash.welcome"></span>, <span id="userName"></span></h3>

    <div class="row g-4">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 data-i18n="dash.timer"></h5>
            <div id="timerStatus" class="mb-2 text-muted" data-i18n="dash.noTimer"></div>
            <div class="d-flex gap-2">
              <select class="form-select form-select-sm" id="timerProject"></select>
              <button class="btn btn-success btn-sm" id="startBtn" data-i18n="dash.start"></button>
              <button class="btn btn-danger btn-sm d-none" id="stopBtn" data-i18n="dash.stop"></button>
            </div>
          </div>
        </div>

        <div class="card shadow-sm mt-4">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="mb-0" data-i18n="dash.projects"></h5>
              <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newProjectModal" data-i18n="dash.newProject"></button>
            </div>
            <div id="projectList"></div>
          </div>
        </div>

        <!-- New project modal -->
        <div class="modal fade" id="newProjectModal" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="newProjectForm">
                <div class="modal-header">
                  <h5 class="modal-title" data-i18n="dash.newProject"></h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                  <div id="newProjectError"></div>
                  <div class="mb-3">
                    <label class="form-label" data-i18n="proj.name"></label>
                    <input type="text" class="form-control" id="np_name" required maxlength="150">
                  </div>
                  <div class="row g-2">
                    <div class="col-6">
                      <label class="form-label" data-i18n="proj.code"></label>
                      <input type="text" class="form-control" id="np_code" maxlength="30">
                    </div>
                    <div class="col-6">
                      <label class="form-label" data-i18n="proj.dueDate"></label>
                      <input type="date" class="form-control" id="np_due">
                    </div>
                  </div>
                  <div class="mb-3 mt-3">
                    <label class="form-label" data-i18n="proj.description"></label>
                    <textarea class="form-control" id="np_desc" rows="2" maxlength="1000"></textarea>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="np_billable" checked>
                    <label class="form-check-label" for="np_billable" data-i18n="proj.billable"></label>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="proj.cancel"></button>
                  <button type="submit" class="btn btn-primary" data-i18n="proj.create"></button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 data-i18n="dash.activity"></h5>
            <ul class="list-group list-group-flush" id="activityList"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/dashboard.js?v=20260706o"></script>
</body>
</html>
