<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="page-head">
      <div>
        <h1 class="ph-title" data-i18n="cli.title"></h1>
        <div class="ph-sub" data-i18n="cli.subtitle"></div>
      </div>
      <button class="btn btn-primary" id="newClientBtn"><i class="bi bi-person-plus"></i> <span data-i18n="cli.new"></span></button>
    </div>

    <!-- Metrics -->
    <div class="row g-3 mb-4" id="clientStats"></div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
          <h6 class="mb-0"><span data-i18n="cli.title"></span> <span class="badge bg-light text-dark border" id="clientCount">0</span></h6>
        </div>
        <div id="clientsList"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="clientModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="clientForm">
          <div class="modal-header">
            <h5 class="modal-title" data-i18n="cli.new"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="clientError"></div>
            <div class="mb-3">
              <label class="form-label" data-i18n="cli.name"></label>
              <input type="text" class="form-control" id="cl_name" required maxlength="150">
            </div>
            <div class="mb-3">
              <label class="form-label" data-i18n="cli.company"></label>
              <input type="text" class="form-control" id="cl_company" maxlength="150">
            </div>
            <div class="row g-2">
              <div class="col-7">
                <label class="form-label" data-i18n="cli.email"></label>
                <input type="email" class="form-control" id="cl_email" maxlength="256">
              </div>
              <div class="col-5">
                <label class="form-label" data-i18n="cli.phone"></label>
                <input type="text" class="form-control" id="cl_phone" maxlength="40">
              </div>
            </div>
            <div class="mb-2 mt-3">
              <label class="form-label" data-i18n="cli.notes"></label>
              <textarea class="form-control" id="cl_notes" rows="2" maxlength="2000"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="proj.cancel"></button>
            <button type="submit" class="btn btn-primary" data-i18n="proj.create"></button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/clients.js?v=20260706o"></script>
</body>
</html>
