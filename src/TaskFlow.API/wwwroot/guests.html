<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="page-head">
      <div>
        <h1 class="ph-title" data-i18n="guest.title"></h1>
        <div class="ph-sub" data-i18n="guest.hint"></div>
      </div>
      <button class="btn btn-primary" id="inviteBtn"><i class="bi bi-person-plus"></i> <span data-i18n="guest.invite"></span></button>
    </div>

    <!-- Metrics -->
    <div class="row g-3 mb-4" id="guestStats"></div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
          <h6 class="mb-0"><span data-i18n="guest.list"></span> <span class="badge bg-light text-dark border" id="guestCount">0</span></h6>
          <div class="input-group input-group-sm" style="max-width:240px">
            <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
            <input class="form-control" id="guestSearch" placeholder="" data-i18n-ph="guest.search">
          </div>
        </div>
        <div id="guestsList"></div>
      </div>
    </div>
  </div>

  <!-- Invite guest -->
  <div class="modal fade" id="inviteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" data-i18n="guest.invite"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="inviteForm">
          <div class="modal-body">
            <div id="inviteAlert"></div>
            <div class="mb-3">
              <label class="form-label" data-i18n="team.email"></label>
              <input type="email" class="form-control" id="inviteEmail" required>
            </div>
            <p class="text-muted small mb-0" data-i18n="guest.inviteHint"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel"></button>
            <button class="btn btn-primary" type="submit" data-i18n="guest.send"></button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- A guest's projects -->
  <div class="modal fade" id="userProjectsModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="upTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="upBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/guests.js?v=20260706o"></script>
</body>
</html>
