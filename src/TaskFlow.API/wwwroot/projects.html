<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="page-head">
      <div>
        <h1 class="ph-title" data-i18n="proj.title"></h1>
        <div class="ph-sub" data-i18n="proj.subtitle"></div>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#projModal">
        <i class="bi bi-plus-lg"></i> <span data-i18n="dash.newProject"></span>
      </button>
    </div>

    <!-- Metrics -->
    <div class="row g-3 mb-4" id="projStats"></div>

    <!-- Toolbar: search + code filter + view switcher -->
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3 flex-wrap">
      <div class="d-flex gap-2 flex-wrap align-items-center">
        <div class="input-group input-group-sm" style="max-width:260px">
          <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
          <input class="form-control" id="projSearch" placeholder="" data-i18n-ph="proj.search">
        </div>
        <select class="form-select form-select-sm w-auto" id="fCode" title="" data-i18n-title="proj.code"></select>
        <select class="form-select form-select-sm w-auto" id="fDept" title="" data-i18n-title="nav.departments"></select>
      </div>
      <div class="btn-group btn-group-sm" role="group" id="viewSwitch">
        <button type="button" class="btn btn-outline-secondary" data-view="list" data-i18n-title="view.list"><i class="bi bi-list-ul"></i></button>
        <button type="button" class="btn btn-outline-secondary" data-view="grid" data-i18n-title="view.grid"><i class="bi bi-grid-3x3-gap-fill"></i></button>
        <button type="button" class="btn btn-outline-secondary" data-view="cards" data-i18n-title="view.cards"><i class="bi bi-card-heading"></i></button>
      </div>
    </div>

    <!-- Projects (rendered per selected view) -->
    <div id="projView"></div>
  </div>

  <!-- Create project -->
  <div class="modal fade" id="projModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form id="projForm">
      <div class="modal-header"><h5 class="modal-title" data-i18n="dash.newProject"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="projErr"></div>
        <div class="mb-3"><label class="form-label" data-i18n="proj.name"></label>
          <input type="text" class="form-control" id="p_name" required maxlength="150"></div>
        <div class="row g-2">
          <div class="col-6"><label class="form-label" data-i18n="proj.code"></label>
            <input type="text" class="form-control" id="p_code" maxlength="30"></div>
          <div class="col-6"><label class="form-label" data-i18n="proj.client"></label>
            <select class="form-select" id="p_client"></select></div>
        </div>
        <div class="mb-3 mt-3"><label class="form-label" data-i18n="proj.dueDate"></label>
          <input type="date" class="form-control" id="p_due"></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="p_billable" checked>
          <label class="form-check-label" for="p_billable" data-i18n="proj.billable"></label></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="proj.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="proj.create"></button>
      </div>
    </form>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/projects.js?v=20260706o"></script>
</body>
</html>
