<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="d-flex align-items-center gap-2 mb-1">
      <a href="/clients.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
      <h3 class="mb-0" id="clientName"></h3>
      <span class="text-muted" id="clientCompany"></span>
    </div>

    <ul class="nav nav-tabs mb-3" id="clientTabs">
      <li class="nav-item"><button class="nav-link active" data-tab="overview" data-i18n="cd.overview"></button></li>
      <li class="nav-item"><button class="nav-link" data-tab="contacts" data-i18n="cd.contacts"></button></li>
      <li class="nav-item"><button class="nav-link" data-tab="projects" data-i18n="cd.projects"></button></li>
      <li class="nav-item"><button class="nav-link" data-tab="timesheets" data-i18n="cd.timesheets"></button></li>
      <li class="nav-item"><button class="nav-link" data-tab="invoices" data-i18n="cd.invoices"></button></li>
    </ul>

    <section class="tab-pane" data-pane="overview">
      <div class="row g-3 mb-3" id="cdStats"></div>
      <div class="card shadow-sm"><div class="card-body" id="cdOverview"></div></div>
    </section>

    <section class="tab-pane d-none" data-pane="contacts">
      <div class="card shadow-sm"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0" data-i18n="cd.contacts"></h6>
          <button class="btn btn-sm btn-primary" id="addContactBtn">+ <span data-i18n="cd.addContact"></span></button>
        </div>
        <div id="cdContacts"></div>
      </div></div>
    </section>

    <section class="tab-pane d-none" data-pane="projects"><div id="cdProjects"></div></section>
    <section class="tab-pane d-none" data-pane="timesheets"><div class="card shadow-sm"><div class="card-body" id="cdTimesheets"></div></div></section>
    <section class="tab-pane d-none" data-pane="invoices"><div class="card shadow-sm"><div class="card-body" id="cdInvoices"></div></div></section>
  </div>

  <!-- Add contact modal -->
  <div class="modal fade" id="contactModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form id="contactForm">
      <div class="modal-header"><h5 class="modal-title" data-i18n="cd.addContact"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="contactError"></div>
        <div class="mb-2"><label class="form-label" data-i18n="cd.cName"></label><input class="form-control" id="ct_name" required maxlength="150"></div>
        <div class="row g-2">
          <div class="col-6"><label class="form-label" data-i18n="cd.cEmail"></label><input class="form-control" id="ct_email" maxlength="150"></div>
          <div class="col-6"><label class="form-label" data-i18n="cd.cPhone"></label><input class="form-control" id="ct_phone" maxlength="50"></div>
        </div>
        <div class="mb-2 mt-2"><label class="form-label" data-i18n="cd.cPosition"></label><input class="form-control" id="ct_position" maxlength="100"></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="ct_main"><label class="form-check-label" for="ct_main" data-i18n="cd.cMain"></label></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="common.add"></button>
      </div>
    </form>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/client-detail.js?v=20260706o"></script>
</body>
</html>
