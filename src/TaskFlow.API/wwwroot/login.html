<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="container">
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0" id="formTitle" data-i18n="login.title"></h4>
          <button class="btn btn-outline-secondary btn-sm" id="langToggle" data-i18n="lang.toggle"></button>
        </div>

        <div id="errorBox" class="alert alert-danger d-none"></div>

        <!-- Login -->
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" data-i18n="login.email"></label>
            <input type="email" class="form-control" id="loginEmail" required>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="login.password"></label>
            <input type="password" class="form-control" id="loginPassword" required>
          </div>
          <button class="btn btn-primary w-100 mb-2" type="submit" data-i18n="login.submit"></button>
          <button class="btn btn-link w-100" type="button" id="showRegister" data-i18n="login.register"></button>
        </form>

        <!-- Register -->
        <form id="registerForm" class="d-none">
          <div class="mb-3">
            <label class="form-label" data-i18n="register.company"></label>
            <input type="text" class="form-control" id="regCompany" required>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="register.fullname"></label>
            <input type="text" class="form-control" id="regName" required>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="login.email"></label>
            <input type="email" class="form-control" id="regEmail" required>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="login.password"></label>
            <input type="password" class="form-control" id="regPassword" minlength="8" required>
          </div>
          <button class="btn btn-primary w-100 mb-2" type="submit" data-i18n="register.submit"></button>
          <button class="btn btn-link w-100" type="button" id="showLogin" data-i18n="register.haveAccount"></button>
        </form>
      </div>
    </div>
  </div>

  <script src="/assets/js/core/i18n.js"></script>
  <script src="/assets/js/core/api.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/pages/login.js"></script>
</body>
</html>
