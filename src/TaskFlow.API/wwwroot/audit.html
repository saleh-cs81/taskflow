<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container-fluid py-4">
    <div class="page-head">
      <div>
        <h1 class="ph-title" data-i18n="audit.title"></h1>
        <div class="ph-sub" data-i18n="audit.subtitle"></div>
      </div>
      <button class="btn btn-outline-secondary btn-sm" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> <span data-i18n="audit.refresh"></span></button>
    </div>

    <!-- Filters -->
    <div class="card shadow-sm mb-3"><div class="card-body py-2">
      <div class="row g-2 align-items-end">
        <div class="col-6 col-md-2">
          <label class="form-label small mb-1" data-i18n="audit.from"></label>
          <input type="date" class="form-control form-control-sm" id="fFrom">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small mb-1" data-i18n="audit.to"></label>
          <input type="date" class="form-control form-control-sm" id="fTo">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small mb-1" data-i18n="audit.action"></label>
          <select class="form-select form-select-sm" id="fAction"></select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small mb-1" data-i18n="audit.entity"></label>
          <select class="form-select form-select-sm" id="fEntity"></select>
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label small mb-1" data-i18n="audit.searchLabel"></label>
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
            <input class="form-control" id="fSearch" data-i18n-ph="audit.search" placeholder="">
          </div>
        </div>
        <div class="col-12 col-md-1 d-grid">
          <button class="btn btn-sm btn-outline-secondary" id="clearBtn" data-i18n="audit.clear"></button>
        </div>
      </div>
    </div></div>

    <!-- Results -->
    <div class="card shadow-sm"><div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr>
            <th data-i18n="audit.time"></th>
            <th data-i18n="audit.user"></th>
            <th data-i18n="audit.action"></th>
            <th data-i18n="audit.record"></th>
            <th data-i18n="audit.changes"></th>
            <th></th>
          </tr></thead>
          <tbody id="auditBody"></tbody>
        </table>
      </div>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
      <span class="text-muted small" id="pageInfo"></span>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-outline-secondary" id="prevBtn"><i class="bi bi-chevron-left flip-rtl"></i></button>
        <button class="btn btn-outline-secondary" id="nextBtn"><i class="bi bi-chevron-right flip-rtl"></i></button>
      </div>
    </div></div>
  </div>

  <!-- Detail -->
  <div class="modal fade" id="auditDetail" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" data-i18n="audit.details"></h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body" id="auditDetailBody"></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/audit.js?v=20260706o"></script>
</body>
</html>
