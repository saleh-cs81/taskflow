<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <h3 class="mb-4" data-i18n="intg.title"></h3>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 data-i18n="intg.connect"></h5>
            <div class="mb-2"><span class="badge" id="statusBadge">—</span>
              <span class="text-muted small ms-2" id="lastSync"></span></div>
            <div id="connectAlert"></div>
            <form id="connectForm" class="mb-3">
              <div class="mb-2">
                <label class="form-label" data-i18n="intg.apiKey"></label>
                <input type="text" class="form-control" id="apiKey" placeholder="paymo-xxxxx" required>
              </div>
              <button class="btn btn-primary btn-sm" type="submit" data-i18n="intg.save"></button>
            </form>
            <button class="btn btn-success" id="runFull" data-i18n="intg.runFull"></button>
            <button class="btn btn-outline-secondary" id="runSync" data-i18n="intg.runSync"></button>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 data-i18n="intg.jobs"></h5>
            <div id="runMsg"></div>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead><tr>
                  <th data-i18n="intg.job"></th>
                  <th data-i18n="intg.status"></th>
                  <th data-i18n="intg.processed"></th>
                  <th data-i18n="intg.errors"></th>
                  <th data-i18n="intg.started"></th>
                </tr></thead>
                <tbody id="jobsBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js"></script>
  <script src="/assets/js/core/api.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/core/realtime.js"></script>
  <script src="/assets/js/core/ui.js"></script>
  <script src="/assets/js/pages/integration.js"></script>
</body>
</html>
