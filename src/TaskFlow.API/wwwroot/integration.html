<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <h3 class="mb-4" data-i18n="intg.title"></h3>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 data-i18n="intg.connect"></h5>
            <div class="mb-2"><span class="badge" id="statusBadge">&mdash;</span>
              <span class="text-muted small ms-2" id="lastSync"></span></div>
            <div id="connectAlert"></div>
            <form id="connectForm" class="mb-3">
              <div class="mb-2">
                <label class="form-label" data-i18n="intg.apiKey"></label>
                <input type="password" class="form-control" id="apiKey" placeholder="paymo API key" required autocomplete="off">
              </div>
              <button class="btn btn-primary btn-sm" type="submit" data-i18n="intg.save"></button>
            </form>
            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-success" id="runFull" data-i18n="intg.runFull"></button>
              <button class="btn btn-outline-secondary" id="runSync" data-i18n="intg.runSync"></button>
              <button class="btn btn-outline-danger ms-auto" id="resetBtn" data-i18n="intg.reset"></button>
            </div>

            <!-- live progress -->
            <div id="progressWrap" class="mt-3 d-none">
              <div class="d-flex justify-content-between small mb-1">
                <span id="progressLabel" class="text-muted"></span>
                <span id="progressPct" class="fw-semibold"></span>
              </div>
              <div class="progress" style="height:10px">
                <div class="progress-bar progress-bar-striped progress-bar-animated" id="progressBar" style="width:0%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 data-i18n="intg.jobs"></h5>
            <div id="runMsg"></div>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead><tr>
                  <th data-i18n="intg.job"></th>
                  <th data-i18n="intg.status"></th>
                  <th data-i18n="intg.processed"></th>
                  <th data-i18n="intg.errors"></th>
                  <th data-i18n="intg.started"></th>
                </tr></thead>
                <tbody id="jobsBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Step 1: users -->
    <div class="card shadow-sm mt-4">
      <div class="card-body d-flex flex-wrap align-items-center gap-2">
        <div class="me-auto">
          <h5 class="mb-0" data-i18n="intg.usersTitle"></h5>
          <span class="small text-muted" data-i18n="intg.usersHint"></span>
        </div>
        <button class="btn btn-primary" id="migrateUsersBtn" data-i18n="intg.migrateUsers"></button>
        <button class="btn btn-outline-danger" id="stopBtn" data-i18n="intg.stop" disabled></button>
      </div>
    </div>

    <!-- Step 2: clients -->
    <div class="card shadow-sm mt-4">
      <div class="card-body d-flex flex-wrap align-items-center gap-2">
        <div class="me-auto">
          <h5 class="mb-0" data-i18n="intg.clientsTitle"></h5>
          <span class="small text-muted" data-i18n="intg.clientsHint"></span>
        </div>
        <button class="btn btn-primary" id="migrateClientsBtn" data-i18n="intg.migrateClients"></button>
      </div>
    </div>

    <!-- Step 3: per-project staging -->
    <div class="card shadow-sm mt-4" id="stagingCard">
      <div class="card-body">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
          <h5 class="mb-0 me-auto" data-i18n="intg.stagingTitle"></h5>
          <span class="small" id="catalogSummary"></span>
        </div>
        <div class="d-flex flex-wrap align-items-end gap-2 mb-3">
          <button class="btn btn-outline-secondary btn-sm" id="refreshCatalogBtn" data-i18n="intg.refreshList"></button>
          <span class="text-muted small mx-1" data-i18n="intg.orBatch"></span>
          <div>
            <label class="form-label small mb-0" data-i18n="intg.perBatch"></label>
            <input type="number" id="batchSize" class="form-control form-control-sm" style="width:90px" value="10" min="1">
          </div>
          <button class="btn btn-outline-primary btn-sm" id="migrateBatchBtn" data-i18n="intg.migrateBatch"></button>
          <span class="small text-muted" id="batchHint" data-i18n="intg.batchHint"></span>
        </div>
        <div class="table-responsive" style="max-height:460px;overflow:auto">
          <table class="table table-sm align-middle">
            <thead class="sticky-top" style="background:var(--bs-body-bg)"><tr>
              <th style="width:42px">#</th>
              <th data-i18n="intg.project"></th>
              <th data-i18n="intg.status"></th>
              <th data-i18n="intg.records"></th>
              <th data-i18n="intg.imported"></th>
              <th data-i18n="intg.note"></th>
              <th></th>
            </tr></thead>
            <tbody id="catalogBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/integration.js?v=20260706o"></script>
</body>
</html>
