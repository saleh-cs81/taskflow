<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4" style="max-width: 720px;">
    <h3 class="mb-4" data-i18n="prof.title"></h3>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 data-i18n="prof.account"></h5>
        <dl class="row mb-0">
          <dt class="col-sm-4" data-i18n="prof.name"></dt><dd class="col-sm-8" id="pf_name">—</dd>
          <dt class="col-sm-4" data-i18n="prof.email"></dt><dd class="col-sm-8" id="pf_email">—</dd>
          <dt class="col-sm-4" data-i18n="prof.role"></dt><dd class="col-sm-8" id="pf_roles">—</dd>
          <dt class="col-sm-4" data-i18n="prof.tenant"></dt><dd class="col-sm-8" id="pf_tenant">—</dd>
        </dl>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h5 data-i18n="prof.changePassword"></h5>
        <div id="pwMsg"></div>
        <form id="pwForm">
          <div class="mb-3">
            <label class="form-label" data-i18n="prof.currentPw"></label>
            <input type="password" class="form-control" id="pw_current" required autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="prof.newPw"></label>
            <input type="password" class="form-control" id="pw_new" minlength="8" required autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="prof.confirmPw"></label>
            <input type="password" class="form-control" id="pw_confirm" minlength="8" required autocomplete="new-password">
          </div>
          <button class="btn btn-primary" type="submit" data-i18n="prof.save"></button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js"></script>
  <script src="/assets/js/core/api.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/core/realtime.js"></script>
  <script src="/assets/js/core/ui.js"></script>
  <script src="/assets/js/pages/profile.js"></script>
</body>
</html>
