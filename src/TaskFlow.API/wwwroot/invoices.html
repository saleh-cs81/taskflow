<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="page-head">
      <div>
        <h1 class="ph-title" data-i18n="inv.title"></h1>
        <div class="ph-sub" data-i18n="inv.subtitle"></div>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#invModal">
        <i class="bi bi-plus-lg"></i> <span data-i18n="inv.new"></span>
      </button>
    </div>

    <!-- Metrics -->
    <div class="row g-3 mb-4" id="invStats"></div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th data-i18n="inv.number"></th>
                <th data-i18n="inv.client"></th>
                <th data-i18n="common.status"></th>
                <th data-i18n="inv.issueDate"></th>
                <th class="text-end" data-i18n="common.total"></th>
                <th class="text-end"></th>
              </tr>
            </thead>
            <tbody id="invBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- New invoice -->
  <div class="modal fade" id="invModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <form id="invForm">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="inv.new"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="invErr"></div>
        <div class="row g-2">
          <div class="col-md-5">
            <label class="form-label" data-i18n="inv.client"></label>
            <select class="form-select" id="i_client"></select>
          </div>
          <div class="col-md-3">
            <label class="form-label" data-i18n="inv.issueDate"></label>
            <input type="date" class="form-control" id="i_issue">
          </div>
          <div class="col-md-2">
            <label class="form-label" data-i18n="inv.dueDate"></label>
            <input type="date" class="form-control" id="i_due">
          </div>
          <div class="col-md-2">
            <label class="form-label" data-i18n="inv.taxRate"></label>
            <input type="number" step="0.01" class="form-control" id="i_tax" value="0">
          </div>
        </div>
        <table class="table table-sm mt-3 mb-1">
          <thead>
            <tr>
              <th style="width:55%" data-i18n="inv.lineDesc"></th>
              <th data-i18n="inv.qty"></th>
              <th data-i18n="inv.unitPrice"></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lineBody"></tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-primary" id="addLine">
          <i class="bi bi-plus-lg"></i> <span data-i18n="inv.addLine"></span>
        </button>
        <div class="text-end mt-2">
          <span class="text-muted" data-i18n="common.total"></span>:
          <strong id="invTotal">0.00</strong>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="proj.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="proj.create"></button>
      </div>
    </form>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/invoices.js?v=20260706o"></script>
</body>
</html>
