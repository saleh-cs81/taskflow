<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0" data-i18n="exp.title"></h3>
      <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#expModal" data-i18n="exp.new"></button>
    </div>
    <div class="card shadow-sm"><div class="card-body p-0">
      <table class="table table-sm mb-0 align-middle">
        <thead><tr>
          <th data-i18n="exp.category"></th><th data-i18n="inv.lineDesc"></th>
          <th data-i18n="common.date"></th><th class="text-end" data-i18n="exp.amount"></th>
          <th data-i18n="exp.billable"></th><th></th>
        </tr></thead>
        <tbody id="expBody"></tbody>
      </table>
    </div></div>
  </div>

  <div class="modal fade" id="expModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form id="expForm">
      <div class="modal-header"><h5 class="modal-title" data-i18n="exp.new"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="expErr"></div>
        <div class="mb-3"><label class="form-label" data-i18n="exp.category"></label>
          <input type="text" class="form-control" id="x_cat" required maxlength="100"></div>
        <div class="mb-3"><label class="form-label" data-i18n="inv.lineDesc"></label>
          <input type="text" class="form-control" id="x_desc" maxlength="500"></div>
        <div class="row g-2">
          <div class="col-6"><label class="form-label" data-i18n="exp.amount"></label>
            <input type="number" step="0.01" class="form-control" id="x_amount" required></div>
          <div class="col-6"><label class="form-label" data-i18n="common.date"></label>
            <input type="date" class="form-control" id="x_date"></div>
        </div>
        <div class="mb-2 mt-2"><label class="form-label" data-i18n="proj.client"></label>
          <select class="form-select" id="x_client"></select></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="x_billable">
          <label class="form-check-label" for="x_billable" data-i18n="exp.billable"></label></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="proj.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="proj.create"></button>
      </div>
    </form>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js"></script>
  <script src="/assets/js/core/api.js"></script>
  <script src="/assets/js/core/auth.js"></script>
  <script src="/assets/js/core/realtime.js"></script>
  <script src="/assets/js/core/ui.js"></script>
  <script src="/assets/js/pages/expenses.js"></script>
</body>
</html>
