<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260706o">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="page-head">
      <div>
        <h1 class="ph-title" data-i18n="exp.title"></h1>
        <div class="ph-sub" data-i18n="exp.subtitle"></div>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#expModal">
        <i class="bi bi-plus-lg"></i> <span data-i18n="exp.newExpense"></span>
      </button>
    </div>

    <!-- Metrics -->
    <div class="row g-3 mb-4" id="expStats"></div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h6 class="mb-3"><span data-i18n="exp.list"></span> <span class="badge bg-light text-dark border" id="expCount">0</span></h6>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th data-i18n="common.date"></th>
                <th data-i18n="exp.category"></th>
                <th data-i18n="inv.lineDesc"></th>
                <th data-i18n="proj.client"></th>
                <th data-i18n="common.status"></th>
                <th class="text-end" data-i18n="exp.amount"></th>
                <th class="text-end"></th>
              </tr>
            </thead>
            <tbody id="expBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- New expense -->
  <div class="modal fade" id="expModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form id="expForm">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="exp.newExpense"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="expErr"></div>
        <div class="mb-3">
          <label class="form-label" data-i18n="exp.category"></label>
          <input type="text" class="form-control" id="x_cat" required maxlength="100">
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="inv.lineDesc"></label>
          <input type="text" class="form-control" id="x_desc" maxlength="500">
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label" data-i18n="exp.amount"></label>
            <input type="number" step="0.01" class="form-control" id="x_amount" required>
          </div>
          <div class="col-6">
            <label class="form-label" data-i18n="common.date"></label>
            <input type="date" class="form-control" id="x_date">
          </div>
        </div>
        <div class="mb-2 mt-2">
          <label class="form-label" data-i18n="proj.client"></label>
          <select class="form-select" id="x_client"></select>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="x_billable">
          <label class="form-check-label" for="x_billable" data-i18n="exp.billable"></label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="proj.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="proj.create"></button>
      </div>
    </form>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/core/i18n.js?v=20260706o"></script>
  <script src="/assets/js/core/api.js?v=20260706o"></script>
  <script src="/assets/js/core/auth.js?v=20260706o"></script>
  <script src="/assets/js/core/realtime.js?v=20260706o"></script>
  <script src="/assets/js/core/ui.js?v=20260706o"></script>
  <script src="/assets/js/pages/expenses.js?v=20260706o"></script>
</body>
</html>
